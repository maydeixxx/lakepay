    <section class="login">
        <div class="container">
            <h2 class="login__title">Войти в аккаунт</h2>
            <div class="login__inner">
                <p class="login__label">Вход через Telegram:</p>
                <!-- <script async src="https://telegram.org/js/telegram-widget.js?22"
                        data-telegram-login="lakePayBot"
                        data-size="large"
                        data-onauth="onTelegramAuth(user)">
                </script> -->
                <form id="mock-form">
                    <div><label for="form-id">TG Id: </label><input required type="text" name="id" id="form-id" placeholder="123456..."></div>
                    <div><label for="form-username">Username: </label><input required type="text" name="username" placeholder="John..." id="form-username"></div>
                    <div><label for="form-photoUrl">Photo URL: </label><input required type="text" name="photo_url" placeholder="http://picture..." id="form-photoUrl"></div>
                    
                    
                    <input type="submit" value="Login"/>
                </form>
                
            </div>
            
        </div>
    </section>
    <script type="text/javascript">
        function onTelegramAuth(user) {
            console.log("Telegram user data:", user);

            fetch("https://lakepay.ru/auth/telegram/token", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            })
            .then(response => response.text())
            .then(body => {
                console.log("Ответ сервера:", body);
                alert("Сервер ответил: " + body);
            })
            .catch(error => {
                console.error("Ошибка при отправке запроса:", error);
                alert("Ошибка: " + error.message);
            });
        }

        const form = document.querySelector("#mock-form");

        const login = async (e) => {
            e.preventDefault(); // Prevent default form submission

            // Collect form data
            const formData = new FormData(form);
            const data = Object.fromEntries(formData); // Convert FormData to object
            console.log(data);
            
            try {
                const response = await fetch('http://localhost:8081/auth/telegram/mock', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data),
                });

                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                const result = await response.json();
                console.log('Success:', result);
                if (result.message == "Logged in") {
                    localStorage.setItem("token", result.token)
                    window.location.href = "/userPage.html"
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        form.addEventListener("submit", login)
    </script>
