server:
  port: 8082

spring:
  datasource:
    url: ${DB_URL:jdbc:jdbc:postgresql://lakePayPostgres:5432/lakepay_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create

  application:
    name: chatService

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: chat-service

token:
  signing:
    key: ${JWT_SIGNING_KEY} # JWT signing key
    lifetime: ${JWT_TOKEN_LIFETIME}

debug: ${DEBUG_MODE}

