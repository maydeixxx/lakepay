server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://lakePayPostgres:5432/lakepay_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: admin
  jpa:
    hibernate:
      ddl-auto: create
  application:
    name: chatService

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: chat-service

token:
  signing:
    key: q1o7M1V+7R1Qyx4e0y1m8qLC+xRP0U8UwK0QH5Xt7lQ= # JWT signing key
    lifetime: 1h

#TODO: Disable on prod
debug: true

