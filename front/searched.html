<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="css-nullifier.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <div class="header__logo">
                    <a href="#" class="header__logo"><img src="images/Lake-Pay-end.png" alt=""></a>
                </div>
                <div class="header__catalog">
                    <button>
                        <img src="images/tri-rectangles.svg" alt="">
                        <div class="header__catalog-text">Каталог</div>
                    </button>
                </div>
                <div class="header__input">
                    <input name="text" placeholder=" Поиск" id=""></input>
                </div>
                <div class="header__btns">
                    <li class="header__item">
                        <a href="#">
                            <img src="images/cart.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#">
                            <img src="images/favorite.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item">
                        <div class="new-message"></div>
                        <a href="#">
                            <img src="images/chat.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#">
                            <img src="images/user.svg" alt="">
                        </a>
                    </li>
                </div>
            </div>
        </div>
    </header>

    <section class="findedAd">
        <div class="container">
            <div class="findedAd__inner">
                <div class="findedAd__filter">
                    <div class="findedAd__filter-text">
                        <div class="findedAd__filter-price">
                            <div class="findedAd__filter-price-text">
                                Цена:
                            </div>
                            <div class="findedAd__filter-price-inner">
                                <div class="findedAd__filter-price-item">
                                    <div class="findedAd__filter-price-text">
                                        От:
                                    </div>
                                    <div class="findedAd__filter-price-input">
                                        <input type="" , placeholder="100">
                                    </div>
                                </div>
                                <div class="findedAd__filter-price-item">
                                    <div class="findedAd__filter-price-text">
                                        До:
                                    </div>
                                    <div class="findedAd__filter-price-input">
                                        <input type="text" , placeholder="100">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="filter__category">
                            <div class="filter__category-text">
                                Категория:
                            </div>
                            <div class="filter__category__menu">
                                <!-- todo: Сделать с помощью js раскрывающуюся меню с чекбоксами -->
                                <button class="filter__category__menu-input">
                                    <div class="filter__category__menu-text">
                                        CS2
                                    </div>
                                    <div class="filter__category__menu-img">
                                        <img src="images/arrow.svg" alt="">
                                    </div>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="findedAd__ads">
                    <div class="findedAd__ads-title">
                        Нашли товар по Вашему запросу
                    </div>
                    <div class="findedAd__ads-sort">
                        <div class="findedAd__ads-sort-text">
                            По умолчанию
                        </div>
                        <div class="findedAd__ads-sort-img">
                            <img src="images/arrow_black.svg" alt="">
                        </div>
                    </div>
                    <div class="findedAd__ads__item">
                        <div class="findedAd__ads__item-img"><img src="images/cs2-category.jpg" alt=""></div>
                        <div class="findedAd__ads__item-text">
                            <ul>
                                <li><a href="#">
                                        <div class="findedAd__ads__item-title">Название товара</div>
                                    </a></li>
                                <li>
                                    <div class="findedAd__ads__item-descr">Lorem Ipsum is simply dummy text of the...</div>
                                </li>
                            </ul>
                            <div class="findedAd__ads__btn-price">
                                <button>2000 Р</button>
                            </div>
                            <div class="findedAd__ads__btn-favorite">
                                <button><img src="images/favorite.svg" alt=""></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
    </section>

</body>

</html>
