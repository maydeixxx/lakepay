<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="css-nullifier.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <div class="header__logo">
                    <a href="#" class="header__logo"><img src="images/Lake-Pay-end.png" alt=""></a>
                </div>
                <div class="header__catalog">
                    <button>
                        <img src="images/tri-rectangles.svg" alt="">
                        <div class="header__catalog-text">Каталог</div>
                    </button>
                </div>
                <div class="header__input">
                    <input name="text" placeholder=" Поиск" id=""></input>
                </div>
                <div class="header__btns">
                    <li class="header__item">
                        <a href="#">
                            <img src="images/cart.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#">
                            <img src="images/favorite.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item new-message">
                        <a href="#">
                            <img src="images/chat.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#">
                            <img src="images/user.svg" alt="">
                        </a>
                    </li>
                </div>
            </div>
        </div>
    </header>

    <section class="favorites">
        <div class="container">
            <div class="favorites__inner">
                <div class="favorites__title">
                    Понравившиеся товары:
                </div>
                <div class="favorites__content">
                    <div class="new__card">
                        <div class="new__card-img"><img src="images/cs2-category.jpg" alt=""></div>
                        <div class="new__card-text">
                            <ul>
                                <li><a href="#">
                                        <div class="new__card-title">Название товара</div>
                                    </a></li>
                                <li>
                                    <div class="new__card-descr">Lorem Ipsum is simply dummy text of the...</div>
                                </li>
                            </ul>

                        </div>
                        <div class="new__card-price">
                            <button>2000 Р</button>
                        </div>
                        <div class="new__card-btn-favorite">
                            <button><img src="images/favorite.svg" alt=""></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
