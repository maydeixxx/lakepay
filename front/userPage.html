<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LakePay - Профиль</title>
    <link rel="stylesheet" href="css-nullifier.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <div class="header__logo">
                    <a href="#" class="header__logo"><img src="images/Lake-Pay-end.png" alt=""></a>
                </div>
                <div class="header__catalog">
                    <button>
                        <img src="images/tri-rectangles.svg" alt="">
                        <div class="header__catalog-text">Каталог</div>
                    </button>
                    <div class="header__catalog__panel">
                        <div class="header__catalog__panel-categories">
                            <ul>
                                <li class="header__catalog__item">
                                    <a href="#">
                                        <div class="header__catalog__item-img">
                                            <img src="images/category-pics/cs2-category.jpg" alt="">
                                        </div>
                                        <div class="header__catalog__item-title">Заголовок 1</div>
                                    </a>
                                </li>
                                <li class="header__catalog__item">
                                    <a href="#">
                                        <div class="header__catalog__item-img">
                                            <img src="images/category-pics/cs2-category.jpg" alt="">
                                        </div>
                                        <div class="header__catalog__item-title">Заголовок 1</div>
                                    </a>
                                </li>
                                <li class="header__catalog__item">
                                    <a href="#">
                                        <div class="header__catalog__item-img">
                                            <img src="images/category-pics/cs2-category.jpg" alt="">
                                        </div>
                                        <div class="header__catalog__item-title">Заголовок 1</div>
                                    </a>
                                </li>
                                <li class="header__catalog__item">
                                    <a href="#">
                                        <div class="header__catalog__item-img">
                                            <img src="images/category-pics/cs2-category.jpg" alt="">
                                        </div>
                                        <div class="header__catalog__item-title">Заголовок 1</div>
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="header__input">
                    <input name="text" placeholder=" Поиск" id=""></input>
                </div>
                <div class="header__btns">
                    <li class="header__item">
                        <a href="#">
                            <img src="images/cart.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#">
                            <img src="images/favorite.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item new-message">
                        <a href="#">
                            <img src="images/chat.svg" alt="">
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="#">
                            <img src="images/user.svg" alt="">
                        </a>
                    </li>
                </div>
            </div>
        </div>
    </header>

    <section class="userInfo">
        <div class="container">
            <div class="userInfo__inner">
                <div class="userInfo__text">
                    <div class="userInfo__id">
                        Аккаунт пользователя <br></button><span>@telegram</span>
                    </div>
                    <div class="userInfo_dateOfReg">
                        Дата регистрации: 29.08.2025
                    </div>
                    <div class="userInfo__balance">
                        <div class="userInfo__balance-text">
                            Баланс: 100$
                        </div>
                        <div class="userInfo__balance-btns">
                            <button class="userInfo__balance-btns-item">
                                Вывести
                            </button>
                            <button class="userInfo__balance-btns-item">
                                Пополнить
                            </button>
                        </div>
                    </div>
                    <button class="userInfo__btn-exit">
                        Выйти
                    </button>
                </div>
                <div class="userInfo__img">
                    <img src="" alt="">
                </div>
            </div>
        </div>
    </section>
    <section class="myAdds">
        <div class="container">
            <div class="myAdd__inner">
                <div class="myAdd__inner__title">
                    <div class="myAdd__inner__title-text">
                        Мои объявления
                    </div>
                    <div class="myAdd_inner__title_btn">
                        <button>Добавить объявление</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <section class="addAd">
        <div class="container">
            <div class="addAd__inner">
                <div class="addAd__inner-Title">
                    Создать объявление
                    <button><img src="images/cross.svg" alt=""></button>
                </div>
                <div class="addAd__inputTitle">
                    <div class="addAd__inputTitle-title">
                        Введите название
                    </div>
                    <input type="text" placeholder="Введите название">
                </div>
                <div class="addAd__input__category">
                    <div class="addAd__input__category-title">Выберите категорию:</div>
                    <button>--- Выберите категорию --- <img src="images/arrow.svg" alt=""></button>
                </div>
                <div class="addAd__input__descr">
                    <div class="addAd__input__descr-title">
                        Введите описание:
                    </div>
                    <textarea maxlength="400" type="text"></textarea>
                </div>
                <div class="addAd__input__data">
                    <div class="addAd__input__data-title">Введите данные от аккаунта</div>
                    <input type="text">
                </div>
                <button class="addAd__publish">
                    <div class="addAd__publish-text">
                        Опубликовать объявление
                    </div>
                </button>
            </div>
        </div>
    </section>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const createAdButton = document.querySelector(".myAdd_inner__title_btn button");
            const AdPopUp = document.querySelector(".addAd");
            const closeAdPopUpBtn = document.querySelector(".addAd__inner-Title button")

            createAdButton.addEventListener("click", () => {
                // Переключение видимости попапа
                if (AdPopUp.style.display !== "block") {
                    AdPopUp.style.display = "block";
                    // AdPopUp.style.position = "fixed";
                } 
            });
            closeAdPopUpBtn.addEventListener("click", () =>{
                AdPopUp.style.display = "none";
            });
        });
    </script>
</body>

</html>
