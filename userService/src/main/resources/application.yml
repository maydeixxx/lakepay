server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lakepay_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DB_MODE:create-drop}
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: ${KAFKA_PRODUCER_RETRIES:3} # Количество повторных попыток при сбое
      acks: all                            # Подтверждение от всех брокеров
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  application:
    name: userService

eureka:
  client:
    service-url:
      defaultZone: http://eureka-service:8761/eureka/

token:
  access:
    lifetime: ${ACCESS_TOKEN_LIFETIME:15m}
  refresh:
    lifetime: ${REFRESH_TOKEN_LIFETIME:30d}
  jwt:
    key: ${JWT_SIGNING_KEY:25uKMKyiebWwXhiOD7mfuEppPjMvZSJQhGDz8mt-w40}
  telegram:
    bot: ${TG_BOT_TOKEN:test_token}

debug: ${DEBUG_MODE:false}