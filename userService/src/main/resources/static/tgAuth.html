<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Telegram Auth</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<script async src="https://telegram.org/js/telegram-widget.js?22"
        data-telegram-login="lakePayBot"
        data-size="large"
        data-onauth="onTelegramAuth">
</script>

<script type="text/javascript">
    axios.interceptors.request.use(
        config => {
            const token = localStorage.getItem('jwtToken');
            if (token && !config.url.includes('/auth/telegram/token')) {
                config.headers['Authorization'] = `Bearer ${token}`;
                config.headers['Content-Type'] = 'application/json';
            }
            return config;
        },
        error => Promise.reject(error)
    );

    function onTelegramAuth(user) {
        console.log("Telegram user data:", user);

        axios.post('https://lakepay.ru/auth/telegram/token', user)
            .then(response => {
                console.log("Ответ сервера:", response.data);
                if (response.data.token) {
                    localStorage.setItem('jwtToken', response.data.token);
                    console.log("Аутентификация успешна! Токен сохранен:", response.data.token);
                    window.location.href = '/dashboard';
                } else {
                    alert("Ошибка: токен не получен. Сообщение: " + response.data.message);
                }
            })
            .catch(error => {
                console.error("Ошибка при отправке запроса:", error);
                alert("Ошибка: " + error.message);
            });
    }

    window.onload = function() {
        if (!localStorage.getItem('jwtToken')) {
            console.log("Токен отсутствует, ожидание авторизации через Telegram.");
        } else {
            axios.get('https://lakepay.ru/api/protected-endpoint')
                .then(response => console.log("Ответ защищённого эндпоинта:", response.data))
                .catch(error => console.error("Ошибка защищённого запроса:", error));
        }
    };

    axios.interceptors.response.use(
        response => response,
        error => {
            if (error.response && error.response.status === 401) {
                localStorage.removeItem('jwtToken');
                alert("Сессия истекла. Пожалуйста, авторизуйтесь заново.");
                window.location.href = '/auth/telegram';
            }
            return Promise.reject(error);
        }
    );
</script>
</body>
</html>
