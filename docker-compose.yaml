services:
  eureka-service:
    build:
      context: eurekaService
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8761:8761"

  ad-service:
    image: ad-service:latest
    build:
      context: .
      dockerfile: adService/src/main/resources/Dockerfile
    restart: unless-stopped
    ports:
      - "8780:8780"
    depends_on:
      - gateway-api
      - eureka-service
      - lakePayPostgres
      - kafka

  user-service:
    build:
      context: userService
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      - gateway-api
      - eureka-service
      - lakePayPostgres
      - kafka

  gateway-api:
    image: gateway-api:latest
    build:
      context: .
      dockerfile: gatewayApi/src/main/resources/Dockerfile
    restart: unless-stopped
    ports:
      - "8990:8990"
    depends_on:
      - eureka-service

  chat-service:
    build:
      context: chatService
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      - lakePayPostgres
      - eureka-service

  notification-service:
    image: notification-service:latest
    build:
      context: .
      dockerfile: notificationService/src/main/resources/Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    depends_on:
      - kafka

  zookeeper:
    image: zookeeper:3.9.3
    restart: unless-stopped
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    restart: unless-stopped
    ports:
      - "29092:29092"
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper
    labels:
      amplicode.image: confluent/kafka

  lakePayPostgres:
    image: postgres:17.4
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: lakepay_db

  payment-service:
    image: payment-service:latest
    build:
      context: .
      dockerfile: paymentService/src/main/resources/Dockerfile
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      - eureka-service
      - gateway-api
      - zookeeper
      - lakePayPostgres
      - kafka
    labels:
      amplicode.image: springboot

volumes:
  userPostgres_data:
  adPostgres_data:
  kafka_data:
  postgres_data:
