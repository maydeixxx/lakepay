spring:
  application:
    name: gatewayApi

  cloud:
    gateway:
      routes:
        - id: userService
          uri: lb://userService
          predicates:
            - Path=/userService/**
          filters:
            - StripPrefix=1

        - id: adService
          uri: lb://adService
          predicates:
            - Path=/adService/**
          filters:
            - StripPrefix=1

server:
  port: 8990

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
